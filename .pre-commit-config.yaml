repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: .venv/bin/pyright app
        language: system
        pass_filenames: false
        types: [python]
