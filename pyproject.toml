[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/deps.py" = ["B008"]

[tool.pyright]
include = ["app"]
exclude = ["app/tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
